name: Publish Python 🐍 distributions 📦 to PyPI and TestPyPI

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/erpbrasil.base
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # hatch-vcs le a versao das tags
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and check
      run: |
        python -m pip install --upgrade pip build twine check-wheel-contents
        python -m build --sdist --wheel --outdir dist/ .
        check-wheel-contents dist/*.whl --ignore W002
        python -m twine check --strict dist/*
        ls dist
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Temporary workaround for https://github.com/pypa/gh-action-pypi-publish/issues/283
        attestations: false
