[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "erpbrasil.base"
description = "erpbrasil.base - Biblioteca python para auxiliar em operações corriqueiras dos ERPs Python Brasileiros."
readme = "README.rst"
authors = [
  {name = "Luis Felipe Mileo", email = "mileo@kmee.com.br"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
# Piso 3.7: o codigo usa `from __future__ import annotations`. O Odoo 12 (Python 3.6)
# fica com a ultima versao que o pip resolve para ele (2.4.2 ainda nao, 2.3.x).
requires-python = ">=3.7"
dependencies = [
    "importlib_metadata; python_version<'3.8'",
]
scripts = {"erpbrasil.base" = "erpbrasil.base.cli:main"}
dynamic = ["version"]

# O namespace `erpbrasil` e compartilhado com erpbrasil.assinatura, erpbrasil.transmissao e
# erpbrasil.edoc; o wheel leva src/erpbrasil/__init__.py com pkgutil.extend_path.
[tool.hatch.build.targets.wheel]
packages = ["src/erpbrasil"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "CHANGELOG.rst",
    "CONTRIBUTING.rst",
    "LICENSE",
    "README.rst",
    "tox.ini",
]


[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "coverage[toml]",
]
doc = [
    "sphinx",
    "furo",
    "myst-parser",
    "towncrier",
    "sphinxcontrib-towncrier",
]

[project.urls]
Homepage = "https://github.com/erpbrasil/erpbrasil.base"
Documentation = "https://erpbrasilbase.readthedocs.io/"
Changelog = "https://erpbrasilbase.readthedocs.io/en/latest/changelog.html"
Source = "https://github.com/erpbrasil/erpbrasil.base"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = [
    "/.github",
]

# mypy

[tool.mypy]
strict = true
show_error_codes = true

# coverage

[tool.coverage.run]
branch = true
source = ["erpbrasil.base"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
]

# towncrier

[tool.towncrier]
name = "erpbrasil.base"
directory = "news"
filename = "CHANGELOG.md"
title_format = "## [{version}](https://github.com/erpbrasil/erpbrasil.base/tree/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/erpbrasil/erpbrasil.base/issues/{issue})"
underlines = ["", "", ""]

# ruff

[tool.ruff]
fix = true
line-length = 120
select = [
    "E", "F", "W", "C90", "B", "I", "UP", "RUF", "TCH"
]
# piso da lib; o UP so sugere sintaxe que o 3.7 aceita
target-version = "py37"
# UP031 (troca de % por format) mexe em codigo que funciona; fica para quando o modulo for tocado
ignore = ["UP031"]

[tool.ruff.per-file-ignores]
"__main__.py" = ["B008"]

[tool.ruff.mccabe]
max-complexity = 13

[tool.ruff.isort]
known-first-party = ["erpbrasil.base"]
combine-as-imports = true

# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["migrations"]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-modules",
    "--doctest-glob=*.rst",
    "--tb=short",
]
